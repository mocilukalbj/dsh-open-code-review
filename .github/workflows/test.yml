name: Test plugin
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dsh: ['0.1.7-rc.2', '0.2.0-rc.2']
    runs-on: ${{ matrix.os }}
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: matrix.dsh == '0.2.0-rc.2'
        run: npm ci --ignore-scripts
      - if: matrix.dsh != '0.2.0-rc.2'
        run: node scripts/select-test-host.js ${{ matrix.dsh }}
      - if: matrix.dsh != '0.2.0-rc.2'
        run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm pack --ignore-scripts
